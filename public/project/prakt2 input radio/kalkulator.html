<!DOCTYPE html>
<html lang="en">
<head>

    <title>Kalkulator</title>
</head>
<body>
    <form id="form-text" name="form-text" method="POST" action="prosesHitung.php">

                <td>Angka 1</td>
                <td>: <input type="text" name="Angka1" id="nilaiA"></td>

            <tr>
